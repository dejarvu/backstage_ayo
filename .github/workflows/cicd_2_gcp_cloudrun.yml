name: ci-cd to Cloud Run

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ "cloud-run" ]
  pull_request:
    branches: [ "cloud-run" ]

env:
  REPO: backstage-ayo
  IMAGE: backstage
  SERVICE_NAME: backstage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: yarn install

      - name: Compile TypeScript
        run: yarn tsc

      - name: Run Unit Tests
        run: yarn test:all

      - name: Build the application
        run: yarn build:all

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: yarn install

      - name: Build the application
        run: yarn build:all

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GKE_REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build --no-cache \
          -t ${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
          -f packages/backend/Dockerfile .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image=${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
          --region=${{ secrets.GKE_REGION }} \
          --platform=managed \
          --allow-unauthenticated \
          --port=7007 \
          --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ secrets.GKE_REGION }} \
          --format='value(status.url)')
          echo "App is live at: $URL"